[project]
name = "sokogate-scraper"
version = "1.0.0"
description = "Production-grade scraper pipeline for sokogate.com"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sokogate / Ultimo Trading" }]

# Runtime dependencies
dependencies = [
    # HTTP / HTML
    "httpx[socks]>=0.27.0,<0.28",
    "beautifulsoup4>=4.12.0,<4.13",
    "lxml>=5.0,<5.2",
    # Browser automation
    "playwright>=1.47.0,<1.50",
    # Database
    "psycopg[binary,pool]>=3.2,<3.3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    # Task queue & scheduling
    "celery[redis]>=5.3,<5.4",
    "redis>=5.0,<5.1",
    # API
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.6,<2.10",
    "pydantic-settings>=2.2,<2.5",
    # Observability
    "structlog>=24.1,<25.0",
    "prometheus-client>=0.20,<0.21",
    # Parsing & data
    "user-agents>=2.2,<2.3",
    # Retry / backoff
    "tenacity>=9.0,<9.1",
    # CLI
    "typer[all]>=0.9,<0.13",
    "python-dotenv>=1.0,<1.1",
    # HTTP proxy helpers
    "tls-client>=0.3,<0.4",
    # JSON / schema
    "orjson>=3.9,<3.11",
    "ujson>=5.8,<5.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<8.4",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-mock>=3.12,<3.14",
    "httpx[socks]>=0.27",
    "ruff>=0.3,<0.4",
    "mypy>=1.8,<1.12",
    "types-beautifulsoup4",
    "types-psycopg2",
    "respx>=0.21,<0.22",   # httpx mocking for tests
]

[project.scripts]
sokogate-scrape  = "sokogate_scraper.main:run_cli"
sokogate-api     = "sokogate_scraper.api.main:run_api"
sokogate-worker  = "sokogate_scraper.scheduler.celery_app:run_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "UP006"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sokogate_scraper"]
branch = true
